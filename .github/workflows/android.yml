name: Android CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: ./gradlew lintDebug --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Summarise failures as annotations
        if: failure()
        run: |
          grep -E '^e: |[Ee]rror:|FAILED|Execution failed|Could not (resolve|find)|\[[A-Za-z]+\]$' build.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
          grep -A6 'What went wrong' build.log | head -12 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
