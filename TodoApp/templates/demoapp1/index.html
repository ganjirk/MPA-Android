{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TodoList App</title>

	<link href="https://fonts.googleapis.com/css?family=Oswald" rel="stylesheet">

	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<link rel="stylesheet" href="{% static 'demoapp1/bs/css/flatly.min.css' %}" />
	<link rel="stylesheet" href="{% static 'demoapp1/styles.css' %}" />
	
</head>

<body>

	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<a style="color:white;" class="navbar-brand">ToDo</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			<ul class="navbar-nav mr-auto">
				<li class="nav-item active">
					<a class="nav-link" href="../">Home <span class="sr-only">(current)</span></a>
				</li>
			</ul>
		</div>
	</nav>

	<div class="container-fluid" id="wrapper">

		<div class="row">
			<div class="col-lg-4 col-lg-offset-4" id="content">
				<h1>What to do today </h1>

				<form action="{% url 'add' %}" method="POST" role="form">
					{% csrf_token %}
					<div class="form-group">
						<div class="input-group">
							{{form.text}}
							<!-- <input type="text" class="form-control" placeholder="Enter todo e.g. Book Appointment" aria-label="Todo" aria-describedby="add-btn"> -->
							<span class="input-group-btn">
								<button type="submit" class="btn btn-default" id="add-btn">ADD</button>
							</span>
						</div>
					</div>
				</form>

				<div class="row t10">
					<div class="col-lg-12">
						<div class="btn-toolbar">
							<div class="btn-group">
								<a href="{% url 'deletecompleted' %}">
									<button type="button" class="btn btn-warning">
										<i class="glyphicon glyphicon-trash"></i> DELETE COMPLETED
									</button></a>
							</div>
							<div class="btn-group">
								<a href="{% url 'deleteall' %}">
									<button type="button" class="btn btn-danger">
										<i class="glyphicon glyphicon-trash"></i> DELETE ALL
									</button></a>
							</div>
						</div>
					</div>
				</div>

				<ul class="list-group t20">
					{% for demoapp1 in todo_items %}
					{% if demoapp1.completed %}
					<li class="list-group-item todo-completed">{{demoapp1.text}}</li>
					{% else %}
					<a href="{% url 'completed' demoapp1.id %}">
						<li class="list-group-item">{{demoapp1.text}}</li>
						{% endif %}
						{% endfor %}
				</ul>
			</div>
		</div>
		<footer>
			<div class="row pad">
				<div class="col-lg-12 text-center">
					Copyright &copy; vihaRiya
				</div>
			</div>
		</footer>
	</div>


</body>

</html>
