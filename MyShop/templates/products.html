{% extends 'base.html' %}

<!-- {% load static %} -->
{% block content %}
    <div class="row">
        {% for myshop in myshop %}
            <div class="col">
                <div class="card" style="width: 18rem;">
                    <img src="{{ myshop.image_url }}" class="card-img-top" alt="...">                    
                    <div class="card-body">
                        <h5 class="card-title">{{ myshop.name }}</h5>
                        <p class="card-text">$ {{ myshop.price }}&nbsp;&nbsp;&nbsp;&nbsp;
                        <button type="button" class="btn rounded-pill btn-sm btn-info">
                        InStock <span class="badge rounded-pill bg-secondary">{{ myshop.stock }}</span>
                        </button>
                        </p>
                        <div class="d-grid gap-2">
                            <a href="#" class="btn btn-primary btn-lg">
                                Add to Cart &nbsp;&nbsp; {% include "cart4.svg" %}                           
                                 
                            </a>
                        </div>   
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
